<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设备登录统计报表 V10 - Uulai / U8</title><style>

und:#3265ff;color:white;border-color:#3265ff}.table-wrap{overflow:auto;max-width:100%}table{border-collapse:collapse;min-width:1120px;width:100%;font-size:12px}th,td{border:1px solid #e7ecf4;padding:11px 9px;text-align:center;white-space:nowrap}th{background:#edf2f8;color:#667387;font-weight:500}tbody tr:nth-child(even){background:#fafbfd}.link{color:#3265ff;cursor:pointer;text-decoration:none}.link:hover{text-decoration:underline}.pagebar{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:15px}.pagebar button{border:1px solid #dce2eb;background:#fff;padding:5px 10px;color:#58677f}.pagebar button:disabled{opacity:.35}.small{font-size:12px;color:#8390a1}.hidden{display:none!important}.title{font-size:15px;font-weight:600;color:#36465d;margin:0 0 14px}.hint{margin-top:8px;font-size:12px;color:#8492a6}.pill{display:inline-block;padding:3px 7px;border-radius:3px;background:#eaf0ff;color:#3765df}.summary{display:flex;gap:16px;margin-bottom:13px;flex-wrap:wrap}.summary span{background:#f4f7fc;padding:9px 15px}.back{border:0;background:none;color:#3265ff;cursor:pointer;font-weight:bold}.u8brand{color:#315ff8;font-size:21px;font-weight:bold}.device{font-weight:500;color:#455c7a}@media(max-width:800px){.sidebar{width:145px}.top{gap:12px;overflow:hidden;white-space:nowrap}.main{padding:8px}.panel{padding:10px}.filters{gap:8px}}
</style></head><body>
<div class="switch"><button id="switchUulai" class="active">Uulai 后台</button><button id="switchU8">U8 后台</button><span style="margin-left:auto;align-self:center">V11 · 双后台联动原型</span></div><header id="top" class="top"></header><div id="tabs" class="tabs"></div><div class="shell"><aside id="sidebar" class="sidebar"></aside><main class="main"><section class="panel"><details id="notes"><summary class="note">本次修改说明（点击展开）</summary><div class="note-content" id="noteContent"></div></details><div id="statsFilters"><div class="site-row" id="siteRow"><select class="site-select" id="site"><option>uulai站点</option><option>uulai测试站</option></select></div><div class="filters"><label>开始时间 <input type="date" id="start" value="2026-10-01"></label><label>结束时间 <input type="date" id="end" value="2026-10-23"></label></div><div class="actions"><button class="btn primary" id="search">⌕ 搜索</button><button class="btn" id="reset">↻ 重置</button><button class="btn" id="export">↓ 导出</button><button class="btn" id="exportList">↓ 导出列表</button></div></div><div id="profitFilters" class="hidden"><div id="u8Mode" class="hidden" style="margin-bottom:14px"><button class="btn" style="color:#3265ff;border-color:#3265ff">按会员</button><button class="btn" disabled>按类型</button></div><div class="site-row"><select class="site-select" id="profitSite"><option>uulai站点</option><option>uulai测试站</option></select></div><div class="filters"><label>开始时间 <input type="date" id="pstart"></label><label>结束时间 <input type="date" id="pend"></label><label id="memberIdLabel">会员ID <input id="memberId" placeholder="请输入会员ID"></label><label>会员账号 <input id="account" placeholder="请输入会员账号"></label><label>登录设备 <select id="device"></select></label></div><div class="actions"><button class="btn primary" id="profitSearch">⌕ 搜索</button><button class="btn" id="profitReset">↻ 重置</button><button class="btn" id="profitExport">↓ 导出</button><button class="back" id="back">← 返回设备登录统计报表</button></div></div></section><section class="panel"><div id="statsView"><div class="table-wrap"><table><thead id="statsHead"></thead><tbody id="statsBody"></tbody></table></div><div class="pagebar" id="statsPager"></div></div><div id="profitView" class="hidden"><div class="table-wrap"><table><thead id="profitHead"><tr><th>会员ID</th><th>会员账号</th><th>最后登录设备 <span class="new">NEW</span></th><th>登录日期</th><th>投注笔数</th><th>有效投注额</th><th>已结算金额</th><th>会员盈亏</th></tr></thead><tbody id="profitBody"></tbody></table></div><div class="pagebar" id="profitPager"></div></div></section></main></div>
<script>
(()=>{const $=id=>document.getElementById(id),types=['PC','安卓H5','iOS H5','安卓PWA','iOS PWA','安卓APP','iOS APP'];let backend='uulai',view='stats',statPage=1,profitPage=1,statStart='2026-10-01',statEnd='2026-10-23',statSite='uulai站点',filtered=[];const fmt=n=>Number(n).toLocaleString('en-US');const seedDate=new Date('2026-10-23T12:00:00');const dates=Array.from({length:45},(_,i)=>{let d=new Date(seedDate);d.setDate(d.getDate()-i);return d.toISOString().slice(0,10)});const names=['alpha88','jettulai3','wei258','feee666','u8pony1','felix02','loope111','chuid8h1','susan09','player108','lucky77','star888','moon36','devtester','robin66','eagle10','happy12','lion789','skyway9','alice01','peter07','gameboss','sunrise2','nightfox','orange5','silver99','king123','bravo23','gamer555','lotus18'];
// Synthetic login events are generated per date and device. Each member may log in on several devices.
// Valid means a successful login precedes the member's effective bet on that same date.
function records(date,site){const index=Math.max(0,dates.indexOf(date)),test=site==='uulai测试站',scale=test?12:30,items=[];for(let j=0;j<scale;j++){let devices=types.filter((t,k)=>(j*3+k*5+index)%7<3);if(!devices.length)devices=[types[j%7]];let first=9+(j%4),hasBet=(j+index)%4!==0,betHour=first+2;items.push({id:101000+j,account:names[j],devices,lastDevice:types[(j+index+2)%7],valid:hasBet,bet:hasBet?((j+1)*37.25):0,loginHour:first,betHour,betCount:hasBet?j%6+1:0,date})}return items}
function getStats(){return dates.filter(d=>d>=statStart&&d<=statEnd).map(d=>{let rs=records(d,backend==='u8'?'uulai站点':statSite);return {date:d,counts:[{total:rs.length,valid:rs.filter(x=>x.valid).length},...types.map(t=>({total:rs.filter(x=>x.devices.includes(t)).length,valid:rs.filter(x=>x.devices.includes(t)&&x.valid).length}))]}})}
function renderShell(){let u=backend==='uulai';$('top').classList.toggle('u8',!u);$('top').innerHTML=u?'<span class="logo">UULAI</span>　⌂ 首页　 ▤ 报表统计　 ♙ 会员管理　 ▦ 财务管理　 ⊞ 站点管理　 ⚙ 系统管理':'<span class="u8brand">JUAN365</span>　　仪表盘　 /　报表　 /　设备登录统计报表';$('tabs').textContent=u?'首页　 /　报表统计　 /　'+(view==='profit'?'会员盈亏报表':'设备登录统计报表'):'仪表盘　 /　'+(view==='profit'?'会员盈亏':'设备登录统计报表');$('sidebar').innerHTML=(u?['实时投注记录','会员账单详情','资金报表','盈亏报表','会员盈亏报表','游戏盈亏报表','业务报表','会员福利报表','设备登录统计报表','站点看板']:['首页','会员','审核','报表','会员全民推广报表','会员活动金报表','回归玩家福利赠送报表','设备登录统计报表','会员盈亏报表','界面','系统']).map(x=>'<div class="nav '+((view==='profit'?x==='会员盈亏报表':x==='设备登录统计报表')?'sel':'')+'">'+x+(x==='设备登录统计报表'?'<span class="new">NEW</span>':'')+'</div>').join('');$('noteContent').innerHTML=u?'① 新增设备登录统计报表，统计每日登录人数与有效登录人数。<br>② 成功登录计入登录人数；成功登录后产生有效投注计入有效登录人数。<br>③ 当天满足有效条件后，该会员当天登录过的各设备均计入有效登录；设备内去重，总人数跨设备去重。<br>④ 会员访问设备信息可参考【会员基础信息 → 最后登录设备】字段；历史数据须使用当日登录设备记录。<br>⑤ 设备登录统计报表中「登录人数」为普通文字、不支持点击；点击蓝色高亮的「有效登录人数」，跳转至【会员盈亏报表】，自动带入所选日期（开始/结束时间均为该日期）、对应登录设备及有效登录会员的数据范围。<br>⑥ 【会员盈亏报表】会员账号右侧新增「最后登录设备」字段，展示会员当前最新登录设备；该字段同步增加至列表导出，导出值与列表保持一致。':'① 新增设备登录统计报表，统计每日登录人数与有效登录人数。<br>② 成功登录计入登录人数；成功登录后产生有效投注计入有效登录人数。<br>③ 当天满足有效条件后，该会员当天登录过的各设备均计入有效登录；设备内去重，总人数跨设备去重。<br>④ 会员访问设备信息可参考【用户详情 → 最后登录设备信息】字段；历史数据须使用当日登录设备记录。<br>⑤ 设备登录统计报表中「登录人数」为普通文字、不支持点击；点击蓝色高亮的「有效登录人数」，跳转至【会员盈亏】，自动带入所选日期（开始/结束时间均为该日期）、对应登录设备及有效登录会员的数据范围。<br>⑥ 【会员盈亏】会员账号右侧新增「最后登录设备」字段，展示会员当前最新登录设备；该字段同步增加至列表导出，导出值与列表保持一致。';$('siteRow').classList.toggle('hidden',!u);$('profitSite').parentElement.classList.toggle('hidden',!u);$('u8Mode').classList.toggle('hidden',u);$('memberIdLabel').classList.toggle('hidden',u);$('switchUulai').classList.toggle('active',u);$('switchU8').classList.toggle('active',!u);$('statsFilters').classList.toggle('hidden',view!=='stats');$('profitFilters').classList.toggle('hidden',view!=='profit');$('statsView').classList.toggle('hidden',view!=='stats');$('profitView').classList.toggle('hidden',view!=='profit');}
function pagebar(id,n,p,callback){let max=Math.max(1,Math.ceil(n/10));$(id).innerHTML='<span>共 '+n+' 条</span><button '+(p===1?'disabled':'')+' data-p="prev">上一页</button><span>'+p+' / '+max+'</span><button '+(p===max?'disabled':'')+' data-p="next">下一页</button>';$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>callback(b.dataset.p==='prev'?p-1:p+1))}
function renderStats(){const rows=getStats();$('statsHead').innerHTML='<tr><th rowspan="2">日期</th>'+['总计',...types].map(x=>'<th colspan="2">'+x+'</th>').join('')+'</tr><tr>'+Array.from({length:8},()=>'<th>登录人数</th><th>有效登录人数</th>').join('')+'</tr>';$('statsBody').innerHTML=rows.slice((statPage-1)*10,statPage*10).map(r=>'<tr><td>'+r.date+'</td>'+r.counts.map((c,i)=>'<td>'+fmt(c.total)+'</td><td><a class="link" data-day="'+r.date+'" data-type="'+i+'" data-valid="yes">'+fmt(c.valid)+'</a></td>').join('')+'</tr>').join('')||'<tr><td colspan="17">暂无数据</td></tr>';$('statsBody').querySelectorAll('a').forEach(a=>a.onclick=()=>openProfit(a.dataset.day,Number(a.dataset.type),a.dataset.valid));pagebar('statsPager',rows.length,statPage,p=>{statPage=p;renderStats()})}
let linkedValid='all';function openProfit(day,type,valid){view='profit';$('pstart').value=day;$('pend').value=day;$('profitSite').value=statSite;$('device').value=type===0?'all':types[type-1];linkedValid=valid;$('account').value='';$('memberId').value='';profitPage=1;renderShell();renderProfit()}
function renderProfit(){let site=backend==='u8'?'uulai站点':$('profitSite').value,device=$('device').value,valid=linkedValid,account=$('account').value.trim().toLowerCase(),memberId=$('memberId').value.trim(),a=[];for(const day of dates.filter(d=>d>=$('pstart').value&&d<=$('pend').value)){a.push(...records(day,site).filter(r=>(device==='all'||r.devices.includes(device))&&(valid==='all'||r.valid===(valid==='yes'))&&r.account.toLowerCase().includes(account)&&(!memberId||String(r.id).includes(memberId))))}filtered=a;const u8=backend==='u8';$('profitHead').innerHTML='<tr>'+(u8?['会员ID','会员账号','最后登录设备 <span class="new">NEW</span>','打赏金额','打赏笔数','投注笔数','已结算笔数','未结算笔数','取消笔数','有效笔数','有效投注额','会员盈亏']:['会员ID','会员账号','最后登录设备 <span class="new">NEW</span>','登录日期','投注笔数','有效投注额','已结算金额','会员盈亏']).map(h=>'<th>'+h+'</th>').join('')+'</tr>';$('profitBody').innerHTML=a.slice((profitPage-1)*10,profitPage*10).map(r=>'<tr><td>'+r.id+'</td><td class="link">'+r.account+'</td><td class="device">'+r.lastDevice+'</td>'+(u8?'<td>0</td><td>0</td><td>'+r.betCount+'</td><td>'+r.betCount+'</td><td>0</td><td>0</td><td>'+r.betCount+'</td><td>'+r.bet.toFixed(2)+'</td><td>'+(r.bet*.08).toFixed(2)+'</td>':'<td>'+r.date+'</td><td>'+r.betCount+'</td><td>'+r.bet.toFixed(2)+'</td><td>'+r.bet.toFixed(2)+'</td><td>'+(r.bet*.08).toFixed(2)+'</td>')+'</tr>').join('')||'<tr><td colspan="'+(u8?12:8)+'">暂无符合条件的会员</td></tr>';pagebar('profitPager',a.length,profitPage,p=>{profitPage=p;renderProfit()})}
function exportCsv(headers,rows,filename){const csv='\ufeff'+[headers,...rows].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function exportStats(){exportCsv(['日期',...['总计',...types].flatMap(t=>[t+'登录人数',t+'有效登录人数'])],getStats().map(r=>[r.date,...r.counts.flatMap(c=>[c.total,c.valid])]),'设备登录统计报表.csv')}
function exportProfit(){exportCsv(backend==='u8'?['会员ID','会员账号','最后登录设备','打赏金额','打赏笔数','投注笔数','已结算笔数','未结算笔数','取消笔数','有效笔数','有效投注额','会员盈亏']:['会员ID','会员账号','最后登录设备','登录日期','投注笔数','有效投注额','已结算金额','会员盈亏'],filtered.map(r=>backend==='u8'?[r.id,r.account,r.lastDevice,0,0,r.betCount,r.betCount,0,0,r.betCount,r.bet,(r.bet*.08).toFixed(2)]:[r.id,r.account,r.lastDevice,r.date,r.betCount,r.bet,r.bet,(r.bet*.08).toFixed(2)]),'会员盈亏报表_设备登录明细.csv')}
$('device').innerHTML='<option value="all">全部设备</option>'+types.map(t=>'<option value="'+t+'">'+t+'</option>').join('');$('switchUulai').onclick=()=>{backend='uulai';view='stats';statPage=1;renderShell();renderStats()};$('switchU8').onclick=()=>{backend='u8';view='stats';statPage=1;renderShell();renderStats()};$('search').onclick=()=>{if($('start').value>$('end').value)return alert('开始时间不能晚于结束时间');statStart=$('start').value;statEnd=$('end').value;statSite=$('site').value;statPage=1;renderStats()};$('reset').onclick=()=>{$('start').value=statStart='2026-10-01';$('end').value=statEnd='2026-10-23';$('site').value=statSite='uulai站点';statPage=1;renderStats()};$('export').onclick=exportStats;$('exportList').onclick=exportStats;$('profitSearch').onclick=()=>{if($('pstart').value>$('pend').value)return alert('开始时间不能晚于结束时间');profitPage=1;renderProfit()};$('profitReset').onclick=()=>{$('account').value='';$('memberId').value='';$('device').value='all';linkedValid='all';profitPage=1;renderProfit()};$('profitExport').onclick=exportProfit;$('back').onclick=()=>{view='stats';renderShell();renderStats()};renderShell();renderStats()})();
</script></body></html>
