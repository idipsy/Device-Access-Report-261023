<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设备访问统计报表 · Uulai / U8 原型</title><style>
*{box-sizing:border-box}body{margin:0;font:13px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;color:#333;background:#f1f3f6}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.top-switch{height:44px;background:#182439;color:#e6edff;display:flex;align-items:center;gap:10px;padding:0 18px}.top-switch button{border:1px solid #56647a;color:#dce6fb;background:transparent;border-radius:5px;padding:6px 17px}.top-switch button.active{background:#3568ff;border-color:#3568ff;color:white}.top-switch .note{margin-left:auto;font-size:12px;color:#aab8ce}.shell{height:calc(100vh - 44px);min-height:650px;display:flex;flex-direction:column}.uulai-top{height:57px;background:#2f63fa;color:white;display:flex;align-items:center;padding:0 18px;gap:0;flex-shrink:0}.uulai-top .nav{padding:13px 14px;text-align:center;min-width:76px;font-size:12px}.uulai-top .nav.active{background:#2456df}.uulai-top .nav small{display:block;font-size:17px;margin-bottom:3px}.uulai-top .user{margin-left:auto}.u8-top{height:83px;background:#fff;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid #e9edf2;flex-shrink:0}.u8-logo{font-size:28px;font-weight:900;color:#f69c17;text-shadow:2px 2px #2876f7;margin-right:75px}.u8-top .crumb{font-size:13px}.u8-top .user{margin-left:auto;color:#376aff}.main{display:flex;min-height:0;flex:1}.sidebar{width:213px;background:#fff;flex-shrink:0;overflow-y:auto;border-right:1px solid #e4e9f2;padding:12px 0}.side-heading{font-size:12px;padding:12px 18px;color:#626d7e}.side-item{padding:12px 17px 12px 32px;color:#606b7b;font-size:12px;white-space:nowrap}.side-item.selected{background:#edf2ff;color:#2d61ff;font-weight:600;border-left:3px solid #3267ff;padding-left:29px}.side-item.parent{font-weight:600;color:#555;padding-left:18px}.new{background:#ff653e;color:white;font-size:10px;border-radius:3px;padding:1px 4px;margin-left:5px;vertical-align:middle}.content{flex:1;min-width:0;overflow:auto;padding:0 14px 24px}.tabs{height:40px;display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden}.tab{padding:10px 13px;background:#e8ebf0;color:#6e7686;font-size:11px;border-radius:3px}.tab.active{background:#3265ff;color:white}.panel{background:white;border:1px solid #e5eaf1;margin-bottom:10px;padding:16px}.report-title{font-size:17px;font-weight:600;margin:2px 0 12px;display:flex;align-items:center;gap:10px}.help{border:1px solid #e4e9f1;background:#f9fbff;border-radius:5px;margin-bottom:15px}.help summary{cursor:pointer;padding:11px 13px;font-weight:600;color:#445371}.help .body{padding:0 14px 13px;line-height:1.9;color:#647188}.filters{display:flex;flex-direction:column;align-items:stretch;gap:13px}.filter-row{display:flex;gap:20px;align-items:end;flex-wrap:wrap}.site-row{width:100%}.actions-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px}.field label{color:#697587;font-size:12px}.field input,.field select{height:33px;border:1px solid #dce2ec;background:white;color:#4e596b;padding:0 10px;border-radius:3px;min-width:150px}.field input[type=date]{min-width:155px}.actions{display:flex;align-items:center;gap:9px}.btn{padding:8px 17px;border:1px solid #dbe2ed;background:#f7f8fa;border-radius:4px;color:#626d80}.btn.primary{background:#3265ff;color:white;border-color:#3265ff}.btn.export{color:#3265ff;background:#f2f5ff;border-color:#a8bcff}.metrics{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}.metric{min-width:170px;flex:1;background:#f8faff;border:1px solid #e9effc;padding:13px;border-radius:5px}.metric label{font-size:12px;color:#77839a}.metric strong{display:block;font-size:23px;color:#304b82;margin-top:5px}.table-wrap{overflow:auto;border:1px solid #e4e8f0}table{width:100%;border-collapse:collapse;white-space:nowrap;min-width:1050px;text-align:center}th{background:#f5f7fa;color:#5f6b7d;font-weight:500;font-size:12px;padding:13px 10px;border-right:1px solid #e7ebf1;border-bottom:1px solid #e3e8f0}td{font-size:12px;padding:14px 10px;border-right:1px solid #edf0f5;border-bottom:1px solid #edf0f5}tbody tr:nth-child(even){background:#fafbfc}tbody tr:hover{background:#f0f5ff}.sub{color:#8490a1;font-size:11px}.empty{text-align:center;padding:35px;color:#a3acbb}.footer{display:flex;justify-content:flex-end;align-items:center;gap:9px;padding:17px 0;color:#7a8494;font-size:12px}.footer button{border:1px solid #e3e7ef;background:white;padding:6px 11px;border-radius:3px}.footer button.active{background:#3265ff;color:white}.footer select{border:1px solid #e3e7ef;padding:6px}.u8 .sidebar{width:238px}.u8 .content{padding:0 13px 24px}.u8 .tabs{background:white;margin:0 -13px 13px;padding:0 12px}.u8 .tab{padding:7px 11px}.u8 .panel{border-radius:3px}.u8 .side-item{padding-top:11px;padding-bottom:11px}.u8 .side-item.selected{background:#f0f1f4;color:#2363fa}.u8 th{background:#f0f1f3;color:#343b47}.u8 .btn.primary{background:#225dff}.u8 .metric{background:#fafbfd}.u8 .report-title{margin-bottom:18px}@media(max-width:850px){.sidebar{width:165px!important}.uulai-top .nav{min-width:50px;padding:10px 5px}.top-switch .note{display:none}.filters{gap:10px}.field input,.field select{min-width:120px}}
</style></head><body><div class="top-switch"><strong>设备访问统计报表</strong><button id="switch-uulai" onclick="switchMode('uulai')">Uulai 后台</button><button id="switch-u8" onclick="switchMode('u8')">U8 后台</button><span class="note">双后台交互原型 · 模拟数据 · NEW</span></div><div id="app"></div><script>
const types=['PC','安卓H5','iOS H5','安卓PWA','iOS PWA','安卓APP','iOS APP'];const sites=['UU站','U8站','UU8站','UU9站'];let mode='uulai',page=1,pageSize=10,filter=null;
const pad=n=>String(n).padStart(2,'0');const today=new Date(2026,9,23);const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const fmt=n=>n.toLocaleString('en-US');
const data=[];for(let s=0;s<sites.length;s++){for(let i=0;i<45;i++){const d=new Date(today);d.setDate(d.getDate()-i);const base=7800+s*730-i*37+(i%5)*89;const ratios=[.147,.256,.183,.11,.076,.171,.098];const values=ratios.map((r,k)=>Math.round(base*r+(i%3)*k*3));data.push({date:iso(d),site:sites[s],total:base,values})}}
function switchMode(m){mode=m;page=1;filter=null;render()}
function currentSite(){return mode==='u8'?'U8站':'UU站'}
function getRows(){let f=filter||{site:currentSite(),start:'2026-10-01',end:'2026-10-23'};return data.filter(r=>r.site===f.site&&r.date>=f.start&&r.date<=f.end).sort((a,b)=>b.date.localeCompare(a.date))}
function query(){const start=document.getElementById('start').value,end=document.getElementById('end').value,site=mode==='u8'?'U8站':document.getElementById('site').value;if(start>end){alert('开始日期不能晚于结束日期');return}filter={start,end,site};page=1;render()}
function reset(){filter=null;page=1;render()}
function setPage(p){page=p;render()}
function setSize(v){pageSize=Number(v);page=1;render()}
function exportCSV(){const rows=getRows();const headers=['日期','站点','总访问人数',...types.map(x=>x+'访问人数')];const csv=[headers,...rows.map(r=>[r.date,r.site,r.total,...r.values])].map(r=>r.join(',')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${mode}_设备访问统计报表_${iso(today)}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function render(){document.getElementById('switch-uulai').classList.toggle('active',mode==='uulai');document.getElementById('switch-u8').classList.toggle('active',mode==='u8');const u=mode==='uulai',f=filter||{site:currentSite(),start:'2026-10-01',end:'2026-10-23'},rows=getRows(),max=Math.max(1,Math.ceil(rows.length/pageSize));page=Math.min(page,max);const shown=rows.slice((page-1)*pageSize,page*pageSize);const head=u?`<header class="uulai-top">${['首页','报表统计','会员管理','财务管理','站点管理','权限管理','福利中心','运营管理','游戏管理','棋牌管理','系统管理'].map((x,i)=>`<div class="nav ${i===1?'active':''}"><small>${['⌂','▤','♙','▦','⊞','✦','▦','▣','▦','▦','⚙'][i]}</small>${x}</div>`).join('')}<span class="user">◉ Dipsy01　⌄</span></header>`:`<header class="u8-top"><div class="u8-logo">JUAN365</div><div class="crumb">仪表盘　/　设备访问统计报表</div><span class="user">◉　🔔　⚙　管理员</span></header>`;
const side=u?`<div class="side-item">实时投注记录</div><div class="side-item">会员投注记录</div><div class="side-item">会员账单详情</div><div class="side-item parent">资金报表　⌄</div><div class="side-item parent">盈亏报表　⌄</div><div class="side-item parent">业务报表　⌃</div>${['会员福利报表','设备访问统计报表','活动彩金记录','活动彩金审核','游戏人数报表','会员返水记录','会员打赏记录','VIP礼金记录','砸金蛋活动记录'].map(x=>`<div class="side-item ${x==='设备访问统计报表'?'selected':''}">${x}${x==='设备访问统计报表'?'<span class="new">NEW</span>':''}</div>`).join('')}<div class="side-item parent">站点看板　⌄</div>`:`<div class="side-item parent">⌂　首页　⌄</div><div class="side-item parent">♙　会员　⌄</div><div class="side-item parent">▣　审核　⌄</div><div class="side-item parent" style="color:#3265ff">▤　报表　⌃</div>${['会员全民推广报表','会员推广团队报表','会员充值提现报表','充值转换率报表','代理统计报表','中奖记录','游戏收益','会员盈亏','会员活动金报表','会员充值提现汇总表','回归玩家福利赠送报表','设备访问统计报表'].map(x=>`<div class="side-item ${x==='设备访问统计报表'?'selected':''}">${x}${x==='设备访问统计报表'?'<span class="new">NEW</span>':''}</div>`).join('')}<div class="side-item parent">界面　⌄</div><div class="side-item parent">系统　⌄</div>`;
const fields=`<div class="filters">${u?`<div class="filter-row site-row"><div class="field"><label>站点</label><select id="site">${sites.map(x=>`<option ${f.site===x?'selected':''}>${x}</option>`).join('')}</select></div></div>`:''}<div class="filter-row"><div class="field"><label>开始时间</label><input id="start" type="date" value="${f.start}"></div><div class="field"><label>结束时间</label><input id="end" type="date" value="${f.end}"></div></div><div class="actions-row"><button class="btn primary" onclick="query()">⌕　搜索</button><button class="btn" onclick="reset()">↻　重置</button><button class="btn export" onclick="exportCSV()">↓　导出</button><button class="btn export" onclick="exportCSV()">↓　导出列表</button></div></div>`;
const table=`<div class="table-wrap"><table><thead><tr><th>日期</th><th>总访问人数</th>${types.map(t=>`<th>${t}访问人数</th>`).join('')}</tr></thead><tbody>${shown.length?shown.map(r=>`<tr><td>${r.date}</td><td>${fmt(r.total)}</td>${r.values.map(v=>`<td>${fmt(v)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="9" class="empty">暂无符合筛选条件的数据</td></tr>`}</tbody></table></div>`;
const pager=`<div class="footer"><span>共 ${rows.length} 条</span><button ${page<=1?'disabled':''} onclick="setPage(${page-1})">‹</button>${Array.from({length:Math.min(max,7)},(_,i)=>i+1).map(p=>`<button class="${page===p?'active':''}" onclick="setPage(${p})">${p}</button>`).join('')}<button ${page>=max?'disabled':''} onclick="setPage(${page+1})">›</button><span>第 ${page}/${max} 页</span><select onchange="setSize(this.value)">${[10,20,50].map(n=>`<option value="${n}" ${pageSize===n?'selected':''}>${n}条/页</option>`).join('')}</select></div>`;
document.getElementById('app').innerHTML=`<div class="shell ${u?'uulai':'u8'}">${head}<div class="main"><aside class="sidebar">${side}</aside><main class="content"><div class="tabs">${(u?['首页','活动配置','会员福利报表','设备访问统计报表']:['仪表盘','全部会员','会员活动金报表','回归玩家福利赠送报表','设备访问统计报表']).map((x,i,a)=>`<div class="tab ${i===a.length-1?'active':''}">${x}　×</div>`).join('')}</div><section class="panel"><details class="help"><summary>本次修改说明 · 点击展开查看统计口径与新增规则</summary><div class="body">① 新增「设备访问统计报表」，与${u?'会员福利报表':'回归玩家福利赠送报表'}同级。<br>② 仅统计当天成功登录的会员；按站点、自然日及设备类型统计，日期以站点业务时区为准（需后端统一配置）。<br>③ 同一会员同一天同一设备类型多次成功登录仅计1人；跨不同设备类型分别计1人；总人数按站点、日期跨设备去重，故设备人数合计可能大于总人数。<br>④ 访问人数仅记录有效访问：成功登录即为有效；不记录未登录、登录失败或重复登录人数；报表只展示总访问人数及七类设备访问人数，不设置重复的有效访问人数列。<br>⑤ 设备类型：PC、安卓H5、iOS H5、安卓PWA、iOS PWA、安卓APP、iOS APP；由登录事件服务端记录。<br>⑥ ${u?'Uulai：会员访问的设备信息可参考【会员基础信息 → 最后登录设备】字段获取。':'U8：会员访问的设备信息可参考【用户详情 → 最后登录设备信息】字段获取。'}历史访问统计须使用会员每次成功登录时记录的设备类型；「最后登录设备」为动态更新字段，不可直接用于反推历史日期的设备访问人数。<br>⑦ 日期查询、重置、分页和导出按当前站点及筛选范围执行。演示数据仅用于原型验证，不是生产数据。</div></details>${fields}</section><section class="panel">${table}${pager}</section></main></div></div>`}
render();
</script></body></html>
